<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A5 Tecnologia • Esteira de Produção & Diretoria</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      window.__A5_BOOT_AT__ = typeof performance !== "undefined" ? performance.now() : Date.now();
      try {
        if (localStorage.getItem("a5_theme") === "dark") {
          document.documentElement.classList.add("dark", "dark-mode");
        }
      } catch (e) {}
    </script>
    <style>
      #a5-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(135deg, #F4F6FA 0%, #FFFFFF 50%, #E6F0FF 100%);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        color: #18181B;
      }
      html.dark #a5-initial-loader {
        background: linear-gradient(135deg, #09090B 0%, #0F1117 50%, #0A192F 100%);
        color: #F4F4F5;
      }
      .a5-boot-bar-track {
        width: 144px;
        height: 4px;
        border-radius: 9999px;
        overflow: hidden;
        background: rgba(59, 130, 246, 0.16);
      }
      .a5-boot-bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #5D87FF, #2563EB);
        animation: a5BootSlide 1.15s ease-in-out infinite;
      }
      @keyframes a5BootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="a5-initial-loader" aria-hidden="true">

        <defs>
          <linearGradient id="a5BootGrad" x1="1" y1="3" x2="89" y2="59" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
        </defs>
        <rect x="1" y="3" width="88" height="56" rx="12" fill="url(#a5BootGrad)"/>
        <rect x="1.5" y="3.5" width="87" height="55" rx="11.5" stroke="#ffffff" stroke-opacity="0.25"/>

      <div style="font-size: 14px; font-weight: 700; letter-spacing: -0.01em;">

    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
