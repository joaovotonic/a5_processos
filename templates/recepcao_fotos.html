<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Fotos da Recepção | A5 Tecnologia</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px 14px 40px; }
        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 16px 40px #0f172a14;
        }
        h1 { margin: 0; font-size: 1.45rem; }
        .intro { margin: 8px 0 22px; color: #475569; font-size: .95rem; line-height: 1.5; }
        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        label { display: block; color: #334155; font-size: .82rem; font-weight: 650; }
        input, textarea {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            color: #0f172a;
            font: inherit;
            font-size: .95rem;
        }
        input:focus, textarea:focus { outline: 2px solid #38bdf8; outline-offset: 1px; }
        .wide { grid-column: 1 / -1; }
        .photo-field {
            padding: 14px;
            border: 1px dashed #0284c7;
            border-radius: 12px;
            background: #f0f9ff;
        }
        .hint { margin: 7px 0 0; color: #475569; font-size: .78rem; line-height: 1.45; }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px 16px;
            border: 0;
            border-radius: 11px;
            background: #0284c7;
            color: white;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }
        button:disabled { cursor: wait; opacity: .65; }
        #status { margin: 14px 0 0; padding: 12px; border-radius: 10px; font-size: .9rem; }
        #status[hidden] { display: none; }
        #status.success { background: #dcfce7; color: #166534; }
        #status.error { background: #fee2e2; color: #991b1b; }
        .footer { margin: 18px 0 0; color: #64748b; font-size: .78rem; text-align: center; }
        @media (max-width: 520px) {
            body { padding: 12px 10px 28px; }
            main { padding: 19px 15px; border-radius: 15px; }
            .fields { grid-template-columns: 1fr; gap: 12px; }
            .wide { grid-column: auto; }
        }
    </style>
</head>
<body>
<main>
    <h1>Fotos da Recepção</h1>
    <p class="intro">
        Registre os dados do cliente e fotografe o equipamento antes de abrir a Ordem de Serviço no Teorema.
        Depois, a recepção poderá vincular esta entrada à O.S.
    </p>

    <form id="intakeForm" enctype="multipart/form-data">
        <div class="fields">
            <label>
                Cliente / Empresa *
                <input name="client_name" autocomplete="organization" required maxlength="200">
            </label>
            <label>
                Nome fantasia
                <input name="trade_name" autocomplete="organization-title" maxlength="200">
            </label>
            <label>
                CPF / CNPJ
                <input name="cnpj_cpf" inputmode="numeric" autocomplete="off">
            </label>
            <label>
                Telefone
                <input name="phone" type="tel" autocomplete="tel">
            </label>
            <label>
                E-mail
                <input name="email" type="email" autocomplete="email">
            </label>
            <label>
                Cidade / Estado
                <input name="city_state" autocomplete="address-level2">
            </label>
            <label class="wide">
                Endereço
                <input name="address" autocomplete="street-address">
            </label>
            <label>
                Modelo do equipamento
                <input name="equipment_model" autocomplete="off">
            </label>
            <label>
                Número de série
                <input name="serial_number" autocomplete="off">
            </label>
            <label class="wide">
                Defeito informado
                <textarea name="reported_defect" rows="3"></textarea>
            </label>
            <label class="wide photo-field">
                Fotos do equipamento *
                <input name="entry_photos" type="file" accept="image/*" capture="environment" multiple required>
                <span class="hint">No celular, escolha a câmera para fotografar. É possível selecionar mais de uma foto.</span>
            </label>
        </div>
        <button id="submitButton" type="submit">Salvar fotos e dados</button>
        <p id="status" role="status" aria-live="polite" hidden></p>
    </form>

    <p class="footer">A5 Tecnologia · Pré-entrada de fotos</p>
</main>
<script>
    const form = document.getElementById("intakeForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Salvando...";
        status.hidden = true;

        try {
            const response = await fetch("/api/pending-entries", {
                method: "POST",
                body: new FormData(form),
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || "Não foi possível salvar os dados.");
            }
            if (!result.success) {
                throw new Error("O servidor não confirmou o salvamento.");
            }
            form.reset();
            status.className = "success";
            status.textContent = "Fotos salvas. A recepção já pode vincular esta entrada à O.S.";
            status.hidden = false;
        } catch (error) {
            status.className = "error";
            status.textContent = error instanceof Error
                ? error.message
                : "Falha ao salvar. Verifique a conexão e tente novamente.";
            status.hidden = false;
        } finally {
            button.disabled = false;
            button.textContent = "Salvar fotos e dados";
        }
    });
</script>
</body>
</html>
